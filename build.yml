name: Construir Maestro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Criar projeto Android Maestro
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/maestro/ai app/src/main/res/values app/src/main/res/xml

          cat > settings.gradle <<'EOT'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Maestro'
include ':app'
EOT

          cat > build.gradle <<'EOT'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOT

          cat > gradle.properties <<'EOT'
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOT

          cat > app/build.gradle <<'EOT'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maestro.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maestro.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
EOT

          cat > app/src/main/AndroidManifest.xml <<'EOT'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:theme="@style/AppTheme"
        android:label="Maestro AI"
        android:allowBackup="true"
        android:supportsRtl="true">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOT

          cat > app/src/main/res/values/styles.xml <<'EOT'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#3F51B5</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:statusBarColor">#202124</item>
    </style>
</resources>
EOT

          cat > app/src/main/java/com/maestro/ai/MainActivity.java <<'EOT'
package com.maestro.ai;

import android.app.Activity;
import android.os.Bundle;
import android.content.Intent;
import android.graphics.Typeface;
import android.net.Uri;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {
    private EditText editor;
    private EditText chord;
    private int transpose = 0;
    private static final String[] NOTES = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};

    @Override
    public void onCreate(Bundle state) {
        super.onCreate(state);

        ScrollView scroll = new ScrollView(this);
        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(24, 24, 24, 24);
        scroll.addView(root);

        TextView title = new TextView(this);
        title.setText("Maestro AI");
        title.setTextSize(28);
        title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        title.setGravity(Gravity.CENTER);
        root.addView(title, lp());

        TextView sub = new TextView(this);
        sub.setText("Editor de partitura e cifras com IA");
        sub.setTextSize(16);
        sub.setGravity(Gravity.CENTER);
        root.addView(sub, lp());

        chord = new EditText(this);
        chord.setHint("Digite um acorde (ex.: C, Am, F#m7)");
        chord.setSingleLine(true);
        root.addView(chord, lp());

        LinearLayout row = new LinearLayout(this);
        row.setOrientation(LinearLayout.HORIZONTAL);
        Button down = new Button(this);
        down.setText("Transpor -1");
        Button up = new Button(this);
        up.setText("Transpor +1");
        row.addView(down, weightLp());
        row.addView(up, weightLp());
        root.addView(row, lp());

        Button analyze = new Button(this);
        analyze.setText("Analisar acorde");
        root.addView(analyze, lp());

        Button importFile = new Button(this);
        importFile.setText("Importar PDF / Imagem");
        root.addView(importFile, lp());

        editor = new EditText(this);
        editor.setHint("Cole ou escreva aqui sua cifra/partitura...\n\nExemplo:\nC        G\nEu vou cantar...\nAm       F");
        editor.setGravity(Gravity.TOP);
        editor.setMinLines(12);
        editor.setTextSize(16);
        root.addView(editor, lp());

        TextView status = new TextView(this);
        status.setText("Assistente IA: preparado para integração online.\nA edição e transposição básica funcionam localmente.");
        status.setPadding(8, 18, 8, 8);
        root.addView(status, lp());

        down.setOnClickListener(v -> transposeChord(-1));
        up.setOnClickListener(v -> transposeChord(1));
        analyze.setOnClickListener(v -> {
            String c = chord.getText().toString().trim();
            if (c.isEmpty()) {
                Toast.makeText(this, "Digite um acorde primeiro.", Toast.LENGTH_SHORT).show();
                return;
            }
            String rootNote = rootNote(c);
            String type = c.substring(rootNote.length());
            Toast.makeText(this, "Acorde: " + c + " | Fundamental: " + rootNote + " | Tipo: " + (type.isEmpty() ? "maior" : type), Toast.LENGTH_LONG).show();
        });
        importFile.setOnClickListener(v -> {
            Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
            i.addCategory(Intent.CATEGORY_OPENABLE);
            i.setType("*/*");
            i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/pdf", "image/*"});
            startActivityForResult(i, 10);
        });

        setContentView(scroll);
    }

    private void transposeChord(int semitones) {
        String c = chord.getText().toString().trim();
        if (c.isEmpty()) {
            Toast.makeText(this, "Digite um acorde primeiro.", Toast.LENGTH_SHORT).show();
            return;
        }
        String r = rootNote(c);
        if (r.isEmpty()) return;
        String suffix = c.substring(r.length());
        int idx = noteIndex(r);
        String result = NOTES[(idx + semitones + 12) % 12] + suffix;
        chord.setText(result);
        chord.setSelection(result.length());
        transpose += semitones;
    }

    private String rootNote(String c) {
        if (c.length() >= 2 && (c.charAt(1) == '#' || c.charAt(1) == 'b')) return c.substring(0,2).replace('b','#');
        return c.substring(0,1).toUpperCase();
    }

    private int noteIndex(String n) {
        String x = n.toUpperCase();
        if (x.equals("DB")) x = "C#";
        if (x.equals("EB")) x = "D#";
        if (x.equals("GB")) x = "F#";
        if (x.equals("AB")) x = "G#";
        if (x.equals("BB")) x = "A#";
        for (int i=0;i<NOTES.length;i++) if (NOTES[i].equals(x)) return i;
        return 0;
    }

    private LinearLayout.LayoutParams lp() {
        return new LinearLayout.LayoutParams(-1, -2);
    }

    private LinearLayout.LayoutParams weightLp() {
        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, -2, 1f);
        return p;
    }

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode == 10 && resultCode == RESULT_OK && data != null && data.getData() != null) {
            Uri uri = data.getData();
            Toast.makeText(this, "Arquivo selecionado: " + uri.getLastPathSegment(), Toast.LENGTH_LONG).show();
        }
    }
}
EOT

          cat > README.md <<'EOT'
# Maestro AI

Editor Android de partitura e cifras com recursos de transposição e futura integração de IA online.

O workflow do GitHub Actions cria o projeto e gera o APK de debug automaticamente.
EOT

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
